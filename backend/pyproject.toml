[project]
name = "document-chat"
version = "0.1.0"
description = "Multi-agent chat over PDF, Office, spreadsheet, image, and code files"
readme = "README.md"
authors = [
    { name = "karti358", email = "kny3558@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.0.0",
    "duckdb>=1.3.0",
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=11.0.0",
    "pymupdf>=1.26.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.11.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.53.0",
    "langchain-ollama>=1.1.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "open-clip-torch>=3.3.0",
    "streamlit>=1.50.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[project.scripts]
document-chat = "document_chat:main"
document-chat-ui = "document_chat.ui:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
